<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Portfolio - Pragya Verma</title>
  <meta name="description" content="A personal portfolio website with home, art, science, and contact sections, ready for GitHub Pages." />
  <meta property="og:title" content="Creative Portfolio - Pragya Verma" />
  <meta property="og:description" content="A clean, responsive personal website template for creators, artists, and researchers." />
  <meta property="og:type" content="website" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=boska@400,500,700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
      --text-3xl: clamp(2.5rem, 1rem + 4vw, 5rem);

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --space-20: 5rem;
      --space-24: 6rem;

      --color-bg: #f7f6f2;
      --color-surface: #f9f8f5;
      --color-surface-2: #fbfbf9;
      --color-surface-offset: #efeae3;
      --color-border: #d7d2ca;
      --color-divider: #dfd8cf;
      --color-text: #28251d;
      --color-text-muted: #6f6b65;
      --color-text-faint: #9b968e;
      --color-text-inverse: #f9f8f4;
      --color-primary: #0b6a6f;
      --color-primary-hover: #0a5256;
      --color-primary-highlight: #dcebea;
      --radius-sm: 0.375rem;
      --radius-md: 0.75rem;
      --radius-lg: 1.25rem;
      --radius-xl: 1.75rem;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(30, 26, 19, 0.06);
      --shadow-md: 0 8px 24px rgba(30, 26, 19, 0.09);
      --shadow-lg: 0 18px 40px rgba(30, 26, 19, 0.12);
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --content-width: 1160px;
      --font-display: 'Boska', Georgia, serif;
      --font-body: 'Satoshi', Inter, sans-serif;
    }

    [data-theme="dark"] {
      --color-bg: #151412;
      --color-surface: #1d1b19;
      --color-surface-2: #23211e;
      --color-surface-offset: #2a2723;
      --color-border: #3d3933;
      --color-divider: #312e29;
      --color-text: #eee8df;
      --color-text-muted: #b8b1a6;
      --color-text-faint: #8b847a;
      --color-text-inverse: #181715;
      --color-primary: #75b4b8;
      --color-primary-hover: #91c8cb;
      --color-primary-highlight: #213336;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.22);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.28);
      --shadow-lg: 0 18px 40px rgba(0,0,0,0.34);
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) {
        --color-bg: #151412;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.6;
      color: var(--color-text);
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--color-primary) 10%, transparent), transparent 30%),
        var(--color-bg);
      overflow-x: hidden; /* Prevent horizontal scrolling on tiny screens */
    }
    img, svg { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }
    .skip-link {
      position: absolute;
      left: var(--space-4);
      top: -3rem;
      padding: var(--space-3) var(--space-4);
      background: var(--color-primary);
      color: var(--color-text-inverse);
      border-radius: var(--radius-full);
      z-index: 100;
    }
    .skip-link:focus { top: var(--space-4); }
    .container {
      width: min(calc(100% - 2rem), var(--content-width));
      margin-inline: auto;
    }
    .section {
      padding-block: clamp(var(--space-12), 9vw, var(--space-24));
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-full);
      background: var(--color-primary-highlight);
      color: var(--color-primary);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 700;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      line-height: 1.05;
      margin-top: var(--space-4);
      margin-bottom: var(--space-4);
      overflow-wrap: break-word;
    }
    .section-copy {
      color: var(--color-text-muted);
      max-width: 60ch;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      background: color-mix(in srgb, var(--color-bg) 86%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--color-border) 75%, transparent);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 4.5rem;
      gap: var(--space-4);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: var(--space-3);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .brand-mark {
      width: 2.25rem;
      height: 2.25rem;
      color: var(--color-primary);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: var(--space-5);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .nav-links a:hover,
    .nav-links a.active { color: var(--color-text); }
    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .theme-toggle,
    .menu-toggle {
      width: 2.8rem;
      height: 2.8rem;
      border-radius: var(--radius-full);
      display: grid;
      place-items: center;
      background: var(--color-surface);
      border: 1px solid color-mix(in srgb, var(--color-border) 85%, transparent);
      box-shadow: var(--shadow-sm);
    }
    .menu-toggle { display: none; }

    /* Hero section */
    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: clamp(var(--space-8), 6vw, var(--space-16));
      align-items: center;
      min-height: calc(100vh - 4.5rem);
      padding-block: var(--space-8);
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 7vw, 6.8rem);
      line-height: 0.95;
      max-width: 12ch;
      overflow-wrap: break-word;
    }
    .hero p {
      color: var(--color-text-muted);
      font-size: var(--text-lg);
      max-width: 34ch;
      margin-top: var(--space-5);
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      margin-top: var(--space-8);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0.85rem 1.2rem;
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: 700;
      transition: transform var(--transition), background var(--transition), color var(--transition), border-color var(--transition);
      border: 1px solid transparent;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-text-inverse);
      box-shadow: var(--shadow-md);
    }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-secondary {
      background: transparent;
      color: var(--color-text);
      border-color: color-mix(in srgb, var(--color-border) 90%, transparent);
    }
    .hero-visual {
      position: relative;
      min-height: 32rem;
      border-radius: var(--radius-xl);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.04), rgba(0,0,0,0.18)),
        url('https://picsum.photos/seed/creator-portfolio/900/1100') center/cover no-repeat;
      box-shadow: var(--shadow-lg);
    }
    .hero-card {
      position: absolute;
      inset: auto var(--space-4) var(--space-4) auto;
      width: min(18rem, calc(100% - 2rem));
      padding: var(--space-5);
      border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--color-surface) 88%, transparent);
      backdrop-filter: blur(12px);
      border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent);
    }
    .hero-card small {
      display: block;
      color: var(--color-text-faint);
      margin-bottom: var(--space-2);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: var(--text-xs);
    }

    /* Homepage About panel */
    .home-about-panel {
      max-width: 800px;
      margin-inline: auto;
      display: flex;
      gap: var(--space-8);
      align-items: center;
      flex-wrap: wrap;
    }
    .home-about-content {
      flex: 1;
      min-width: min(300px, 100%);
    }
    .home-about-image {
      width: 200px;
      height: 200px;
      border-radius: var(--radius-xl);
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-4);
      margin-top: var(--space-8);
    }
    .stat {
      background: var(--color-surface);
      border: 1px solid color-mix(in srgb, var(--color-border) 75%, transparent);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }
    .stat strong {
      display: block;
      font-size: var(--text-xl);
      font-family: var(--font-display);
    }
    .stat span { color: var(--color-text-muted); font-size: var(--text-sm); }

    /* Art / Gallery section */
    .art-layout {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: var(--space-8);
      align-items: start;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-5);
    }
    .tag {
      padding: 0.55rem 0.85rem;
      border-radius: var(--radius-full);
      background: var(--color-surface);
      border: 1px solid color-mix(in srgb, var(--color-border) 78%, transparent);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: 180px;
      gap: var(--space-4);
    }
    .gallery figure {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      min-height: 100%;
    }
    .gallery figure:nth-child(1) { grid-row: span 2; }
    .gallery figure:nth-child(4) { grid-column: span 2; }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 500ms ease;
    }
    .gallery figure:hover img { transform: scale(1.04); }
    .gallery figcaption {
      position: absolute;
      inset: auto 0 0 0;
      padding: var(--space-4);
      color: #fff;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.72));
      font-size: var(--text-sm);
    }

    /* Science layout */
    .science-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-4);
      margin-top: var(--space-8);
    }
    .science-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      border: 1px solid color-mix(in srgb, var(--color-border) 78%, transparent);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .science-card h3 { font-size: var(--text-lg); }
    .science-card p { color: var(--color-text-muted); }
    .science-meta {
      display: flex;
      justify-content: space-between;
      gap: var(--space-3);
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* About page layout */
    .about-layout {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: var(--space-8);
      align-items: start;
    }
    .about-panel,
    .contact-panel {
      background: var(--color-surface);
      border: 1px solid color-mix(in srgb, var(--color-border) 78%, transparent);
      border-radius: var(--radius-xl);
      padding: clamp(var(--space-5), 4vw, var(--space-8));
      box-shadow: var(--shadow-sm);
    }
    .contact-list {
      display: grid;
      gap: var(--space-4);
      margin-top: var(--space-5);
    }
    .contact-item {
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--color-divider);
    }
    .contact-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .contact-item span { color: var(--color-text-muted); }
    .about-list {
      margin-top: var(--space-5);
      display: grid;
      gap: var(--space-3);
      color: var(--color-text-muted);
    }

    /* Footer */
    .site-footer {
      padding-block: var(--space-8);
      border-top: 1px solid color-mix(in srgb, var(--color-border) 75%, transparent);
      color: var(--color-text-muted);
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    /* Reveal effect */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 700ms ease, transform 700ms ease;
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section.hidden {
      display: none;
    }

    .section.hidden {
      display: none;
    }

    .section.hidden {
      display: none;
    }

    /* Responsive Media Queries */

    /* Tablet breakpoint (980px) */
    @media (max-width: 980px) {
      .hero-grid {
        grid-template-columns: 1fr;
        min-height: auto; /* Fix: stacked layout shouldn't stretch vertical height to 100vh */
        padding-top: var(--space-8);
        gap: var(--space-10);
      }
      .art-layout,
      .about-layout {
        grid-template-columns: 1fr;
      }
      .science-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)); /* 2 columns on tablets for clean grid */
      }
      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr)); /* Keep 3 columns on tablet, fits nicely */
      }
      
      /* Mobile Drawer Menu */
      .nav-links {
        position: absolute;
        left: 1rem;
        right: 1rem;
        top: calc(100% + 0.5rem);
        flex-direction: column;
        align-items: stretch;
        gap: var(--space-3);
        padding: var(--space-5);
        background: var(--color-surface);
        border: 1px solid color-mix(in srgb, var(--color-border) 80%, transparent);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        z-index: 100;
        
        /* Smooth transitions instead of instant display: none/block */
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
        pointer-events: none;
        transition: opacity 220ms cubic-bezier(0.16, 1, 0.3, 1), transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
      }
      .nav-links.open {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }
      .nav-links a {
        display: block;
        padding-block: var(--space-2);
        font-size: var(--text-base);
        border-bottom: 1px solid color-mix(in srgb, var(--color-divider) 40%, transparent);
      }
      .nav-links a:last-child {
        border-bottom: none;
      }
      
      .menu-toggle { display: grid; }
      .hero-visual { min-height: 26rem; }
    }

    /* Mobile breakpoint (640px) */
    @media (max-width: 640px) {
      .container { width: min(calc(100% - 1.25rem), var(--content-width)); }
      .hero-grid { padding-top: var(--space-4); }
      .hero h1 { max-width: 12ch; }
      
      .stats {
        grid-template-columns: 1fr; /* Collapse stats to single column on mobile */
        gap: var(--space-3);
      }
      .science-grid {
        grid-template-columns: 1fr; /* Collapse science cards to single column on mobile */
      }
      .gallery { grid-template-columns: 1fr; grid-auto-rows: 220px; }
      .gallery figure:nth-child(1), .gallery figure:nth-child(4) {
        grid-column: auto;
        grid-row: auto;
      }
      
      /* Mobile header tweaks for absolute smallest screens */
      .header-inner {
        min-height: 4rem;
        gap: var(--space-2);
      }
      .brand {
        gap: var(--space-2);
        font-size: var(--text-sm);
      }
      .brand-mark {
        width: 1.8rem;
        height: 1.8rem;
      }
      .theme-toggle,
      .menu-toggle {
        width: 2.4rem;
        height: 2.4rem;
      }

      /* Full width buttons on mobile are standard practice */
      .hero-actions {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        gap: var(--space-3);
      }
      .hero-actions .btn {
        width: 100%;
      }
      
      /* Centered footer on mobile is much cleaner */
      .footer-inner {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: var(--space-2);
      }
      .contact-item { flex-direction: column; }

      /* Homepage About layout stacking */
      .home-about-panel {
        flex-direction: column-reverse; /* Put photo on top of the biography text on mobile */
        text-align: center;
        gap: var(--space-6);
      }
      .home-about-image {
        margin-inline: auto;
      }
      .home-about-content {
        min-width: 0;
        width: 100%;
      }
      
      /* Reduce hero-visual slightly to fit small screen viewport */
      .hero-visual {
        min-height: 20rem;
      }
      .hero-card {
        padding: var(--space-4);
        right: var(--space-3);
        bottom: var(--space-3);
        width: calc(100% - var(--space-6));
      }
    }

    /* Animation preference reduction */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .reveal { opacity: 1; transform: none; }
      .nav-links { transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="scroll-progress"></div>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#home" aria-label="Go to homepage">
        <svg class="brand-mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M11 45C21 43 23 20 33 18C41 16 44 24 44 31C44 41 38 53 25 53C17 53 11 49 11 45Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M38 13C45 13 52 18 53 28" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span>Pragya Verma</span>
      </a>

      <nav aria-label="Primary navigation">
        <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="#home">Home</a>
          <a href="#art">Art</a>
          <a href="#science">Science</a>
          <a href="#contact">Contact</a>
        </div>
      </nav>

      <div class="header-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="hero section" id="home">
      <!-- About Me Bio Section, moved to the top -->
      <div id="about-container" class="container" style="margin-bottom: var(--space-12);"></div>

      <div id="hero-container" class="container hero-grid"></div>
    </section>

    <section class="section hidden" id="art">
      <div id="art-container" class="container art-layout"></div>
    </section>

    <section class="section hidden" id="science">
      <div id="science-container" class="container"></div>
    </section>

    <section class="section hidden" id="contact">
      <div id="contact-container" class="container"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Pragya Verma. Built for GitHub Pages.</p>
      <p>Update the text, images, and links to make it your own.</p>
    </div>
  </footer>

  <script src="dynamic-content.js"></script>
</body>
